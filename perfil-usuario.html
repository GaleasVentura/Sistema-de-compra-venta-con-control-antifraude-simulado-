<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar {
            background-color: #4b0082;
            padding: 15px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .navbar a:hover {
            background-color: #6a0dad;
        }
        
        .contenedor-dashboard {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .titulo-seccion {
            text-align: center;
            color: #4b0082;
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .tarjeta-perfil {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        
        .header-perfil {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 25px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .avatar-perfil {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background-color: #6a0dad;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }
        
        .nombre-usuario {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .rol-usuario {
            color: #666;
            font-size: 1em;
        }
        
        .menu-opcion {
            display: flex;
            align-items: center;
            padding: 15px;
            background-color: #f9f9fc;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .menu-opcion:hover {
            background-color: #f3e8ff;
            border-color: #6a0dad;
        }
        
        .icono-menu {
            font-size: 22px;
            margin-right: 15px;
            width: 30px;
            text-align: center;
        }
        
        .texto-menu {
            font-weight: 600;
            color: #333;
        }
        
        .menu-cerrar-sesion {
            background-color: #fff;
            border: 1px solid #b22222;
        }
        
        .menu-cerrar-sesion:hover {
            background-color: #ffe6e6;
            border-color: #b22222;
        }
        
        .menu-cerrar-sesion .texto-menu {
            color: #b22222;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="Inicio.html">Volver a la Tienda</a>
        <a href="deteccion-anomalias.html">Detección de Anomalías</a>
        <a href="reporte-antifraude.html">Reporte Antifraude</a>
        <a href="perfil-usuario.html">Perfil de Usuario</a>
    </nav>

    <div class="contenedor-dashboard">
        <h1 class="titulo-seccion">Perfil de Usuario</h1>
        
        <div class="tarjeta-perfil">
            <div class="header-perfil">
                <div class="avatar-perfil">👨‍💼</div>
                <div class="nombre-usuario">Usuario: admin</div>
                <div class="rol-usuario">Rol: Administrador</div>
            </div>
            
            <div class="menu-opcion" onclick="alert('Gestionar Usuarios')">
                <span class="icono-menu">⚙️</span>
                <span class="texto-menu">Gestionar Usuarios</span>
            </div>
            
            <div class="menu-opcion" onclick="alert('Mis Ajustes')">
                <span class="icono-menu">🔧</span>
                <span class="texto-menu">Mis Ajustes</span>
            </div>
            
            <div class="menu-opcion menu-cerrar-sesion" 
                 onclick="if(confirm('¿Seguro que deseas cerrar sesión?')) window.location.href='Inicio.html'">
                <span class="icono-menu">🚪</span>
                <span class="texto-menu">Cerrar Sesión</span>
            </div>
        </div>
    </div>
</body>
</html>
