<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Antifraude</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar {
            background-color: #4b0082;
            padding: 15px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        
        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .navbar a:hover {
            background-color: #6a0dad;
        }
        
        .contenedor-dashboard {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .titulo-seccion {
            text-align: center;
            color: #4b0082;
            font-size: 2em;
            margin-bottom: 30px;
            font-weight: 600;
        }
        
        .tarjeta-reporte {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        
        .estadisticas-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .tarjeta-estadistica {
            background-color: #f9f9fc;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
        }
        
        .estadistica-label {
            font-size: 0.95em;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .estadistica-valor {
            font-size: 2.5em;
            font-weight: bold;
            color: #4b0082;
        }
        
        .btn-generar {
            background-color: #6a0dad;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1em;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
        }
        
        .btn-generar:hover {
            background-color: #4b0082;
        }
        
        .btn-estadisticas {
            background-color: #ffffff;
            color: #6a0dad;
            border: 2px solid #6a0dad;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
            width: 100%;
            font-weight: bold;
        }
        
        .btn-estadisticas:hover {
            background-color: #f3e8ff;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="Inicio.html">Volver a la Tienda</a>
        <a href="deteccion-anomalias.html">Detección de Anomalías</a>
        <a href="reporte-antifraude.html">Reporte Antifraude</a>
        <a href="perfil-usuario.html">Perfil de Usuario</a>
    </nav>

    <div class="contenedor-dashboard">
        <h1 class="titulo-seccion">Reporte Antifraude</h1>
        
        <div class="tarjeta-reporte">
            <div class="estadisticas-grid">
                <div class="tarjeta-estadistica">
                    <div class="estadistica-label">Transacciones Sospechosas:</div>
                    <div class="estadistica-valor">12</div>
                </div>
                <div class="tarjeta-estadistica">
                    <div class="estadistica-label">Fraudes Confirmados:</div>
                    <div class="estadistica-valor">4</div>
                </div>
            </div>
            
            <button class="btn-generar" onclick="alert('Generando reporte PDF...')">
                Generar Reporte PDF
            </button>
            
            <button class="btn-estadisticas" onclick="alert('Mostrando estadísticas detalladas...')">
                Ver Estadísticas
            </button>
        </div>
    </div>
</body>
</html>
